environment:
  state_size: 4
  action_size: 1
  gravity: 9.8
  mass_cart: 1.0
  mass_pole: 0.1
  length: 0.5
  force_mag: 10.0
  dt: 0.02
  theta_threshold_radians: 1.0472 # 60 degrees
  x_threshold: 100
  reward_factor_height: 1.0
  reward_factor_velocity: 0.1
  reward_factor_cart_pos: 0.05
  reward_factor_cart_vel: 0.02

network:
  random_seed: 42
  # --- NEW: Simplified architecture for the CfC model ---
  hidden_size: 32   # Number of neurons in the recurrent layer
  motor_size: 32     # Size of the output mapping layer
  
training:
  num_episodes: 2500
  max_steps_per_episode: 500
  learning_rate: 0.0003
  gamma: 0.99
  ppo_epochs: 10
  ppo_clip: 0.2
  model_save_path: "pendulum_cfc_final.pth" 
  log_save_path: "training_logs_cfc.json"

visualization:
  max_frames: 1000