<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNN Pendulum Visualization</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .container {
            display: flex;
            gap: 20px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        canvas, svg {
            border: 1px solid #ccc;
            background-color: #fafafa;
        }
        .controls {
            margin-top: 15px;
            font-size: 1.2em;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Liquid Neural Network - Inverted Pendulum</h1>
    <div class="container">
        <div>
            <h2>Pendulum Simulation</h2>
            <canvas id="pendulumCanvas" width="600" height="400"></canvas>
        </div>
        <div>
            <h2>Neuron Activations</h2>
            <svg id="networkSvg" width="400" height="400"></svg>
        </div>
    </div>
    <div class="controls">
        Frame: <span id="frameCounter">0</span>
    </div>

    <script src="visualizer.js"></script>
</body>
</html>
